name: Release and Publish

on:
  push:
    branches: [main, master]
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Check Version, Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Read version and check tag existence
        id: version_check
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tag=$tag" >> $GITHUB_OUTPUT

          if gh release view "$tag" > /dev/null 2>&1 || git rev-parse "$tag" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release or tag $tag already exists. Skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "New version detected ($tag). Proceeding to build, release, and publish."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.version_check.outputs.exists == 'false'
        run: npm install

      - name: Run tests
        if: steps.version_check.outputs.exists == 'false'
        run: npm test

      - name: Create Git Tag & GitHub Release
        if: steps.version_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version_check.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

          gh release create "$tag" \
            --title "$tag" \
            --generate-notes

      - name: Publish to npm
        if: steps.version_check.outputs.exists == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create summary
        if: steps.version_check.outputs.exists == 'false'
        run: |
          echo "### 🚀 Released & Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`${{ steps.version_check.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release:** [${{ steps.version_check.outputs.tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version_check.outputs.tag }})" >> $GITHUB_STEP_SUMMARY
          echo "- **npm:** https://www.npmjs.com/package/imgpull" >> $GITHUB_STEP_SUMMARY
